- name: NFS Server Playbook
  hosts: nfs_server
  become: true

  tasks:
    - name: Update APT
      apt:
        update_cache: true

    - name: Install Packages
      apt:
        name:
          - fish
          - tree
          - neofetch
        state: present

    - name: Install NFS Server
      apt:
        name: nfs-kernel-server
        state: present

    - name: Create NFS Server DIR
      file:
        path: "{{ nfs_server.mount_path }}"
        state: directory
        group: nogroup
        owner: nobody
        mode: "0777"

    - name: Configure NFS Exports
      lineinfile:
        path: /etc/exports
        line: "{{ nfs_server.mount_path }} {{ item }}(rw,sync,no_subtree_check,no_root_squash)"
        create: true
        state: present
      loop: "{{ nfs_client.ips }}"

    - name: Apply NFS Configuration
      command: exportfs -ra

    - name: Restart NFS Server
      systemd:
        name: nfs-kernel-server
        state: restarted
        enabled: true
